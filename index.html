<canvas id="g"></canvas><button id="iw">일꾼 찾기 (F1)</button>
<div id="tp"><span style="color:#6cf"><i class="ic m"></i><b id="rm">0</b></span><span style="color:#5f9"><i class="ic g"></i><b id="rg">0</b></span><span style="color:#fc6"><i class="ic s"></i><b id="rs">0</b></span></div><div id="msg"></div>
<div id="hud"><div id="mmw"><canvas id="mm" width="138" height="104"></canvas></div><div id="mid"><div id="info"></div></div><div id="cmd"></div></div>
<script>
/* 미니 스타크래프트 (테란 미러) - 조작 (스타크래프트와 동일)
 좌클릭 선택 / 드래그 박스 / 더블클릭 같은 종류 전체 / Shift 추가 / 우클릭 이동·공격·채취·랠리
 M 이동, S 정지, H 홀드, A 공격이동, SCV: B(건설) → C 커맨드센터, S 서플라이, R 정제소, B 배럭
 커맨드센터 S: SCV / 배럭 M: 마린, U: 전투 강화 / 대기열 슬롯 클릭 = 취소
 P 순찰, R 수리(SCV), T 스팀팩(마린), B→A 아카데미(T 스팀팩·U U-238 연구), 배럭 D 메딕, X 건설 취소, F10 일시정지 / Shift 명령 예약, V 벌처·T 탱크(팩토리), E 시즈 모드·D 탱크 모드 / Ctrl+1~9 부대 지정, 1~9 호출(두 번 누르면 이동), F1 놀고 있는 일꾼, Space 경보 위치, 방향키/가장자리 스크롤 */
const $=i=>document.getElementById(i),cv=$('g'),c=cv.getContext('2d'),M=$('mm'),mc=M.getContext('2d');
const T=32,W=64,H=48,TC=['#3af','#f44'];
const S={scv:{hp:60,r:8,sp:75,cost:50,time:8,rng:14,dmg:5,cd:1},marine:{hp:40,r:7,sp:85,cost:50,time:10,rng:130,dmg:7,cd:.65},
cc:{hp:1000,w:4,h:3,cost:400,time:40,cap:10},dep:{hp:400,w:2,h:2,cost:100,time:12,cap:8},rax:{hp:800,w:3,h:2,cost:150,time:20},ref:{hp:500,w:3,h:2,cost:75,time:10},
medic:{hp:60,r:7,sp:85,cost:50,gas:25,time:10,rng:0,dmg:0,cd:1},aca:{hp:600,w:3,h:2,cost:150,time:18},fac:{hp:1250,w:3,h:2,cost:200,gas:100,time:25},vulture:{hp:80,r:8,sp:130,cost:75,time:14,su:2,rng:160,dmg:20,cd:1.1},tank:{hp:150,r:10,sp:60,cost:150,gas:100,time:22,su:2,rng:224,dmg:24,cd:1.1},min:{r:10},geo:{w:3,h:2},up:{}};
const ARM={marine:1,vulture:1,tank:1};
const UP={stim:{n:'스팀팩',m:100,g:100,t:30},rng:{n:'U-238 탄',m:150,g:150,t:30}};
const NM={scv:'SCV',marine:'마린',cc:'커맨드센터',dep:'서플라이 디팟',rax:'배럭',ref:'정제소',aca:'아카데미',medic:'메딕',fac:'팩토리',vulture:'벌처',tank:'시즈 탱크',min:'미네랄',geo:'베스핀 가스'};
let E,terr,occ,R,up,sel,cam={x:0,y:0},mode,pk,drag,mX=-1,mY=-1,nid,gt,wave,over,aiT,ft=0,fs='',keys={},mmB,hg,vis,fogC,fx,fdata,bm=0,grp=[],alertT=0,alertP=[0,0],lastClk=[0,0],lastG=[0,0],why='',fxs=[],paused=0;
const blk=(x,y)=>x<0||y<0||x>=W||y>=H||terr[y*W+x]||occ[y*W+x];
const fill=(e,v)=>{const s=S[e.k];for(let i=0;i<s.w;i++)for(let j=0;j<s.h;j++)occ[(e.ty+j)*W+e.tx+i]=v};
const nearest=(l,x,y)=>l.reduce((a,e)=>!a||Math.hypot(e.x-x,e.y-y)<Math.hypot(a.x-x,a.y-y)?e:a,null);
let AC,sT={};function snd(f,d,ty='square',v=.05){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function sfx(k,x,y){if(x<cam.x||y<cam.y||x>cam.x+cv.width||y>cam.y+cv.height)return;const n=Date.now();if(n-(sT[k]||0)<70)return;sT[k]=n;snd(150+Math.random()*60,.06,'square',.03)}
const flash=t=>{fs=t;ft=1.6;snd(140,.15,'sine',.1)};
function mk(k,t,x,y,x2){const s=S[k];const e={id:nid++,k,t,x,y,hp:s.hp||1,mhp:s.hp||1,cd:0,rp:0,fl:0,f:0,o:{t:'idle'},path:[],oq:[],en:k=='medic'?50:0,done:1,...x2};E.push(e);return e}
function mkB(k,t,tx,ty,done){const s=S[k],e=mk(k,t,(tx+s.w/2)*T,(ty+s.h/2)*T,{tx,ty,q:[],prog:done?1:0,done:done?1:0});if(!done)e.hp=1;fill(e,1);return e}
function astar(sx,sy,tx,ty){
 const N=W*H,g=new Float32Array(N).fill(1e9),par=new Int16Array(N).fill(-1),cl=new Uint8Array(N);
 const hf=i=>{const dx=Math.abs(i%W-tx),dy=Math.abs((i/W|0)-ty);return Math.max(dx,dy)+.41*Math.min(dx,dy)};
 const s0=sy*W+sx;let open=[s0],best=s0,bh=hf(s0);g[s0]=0;
 while(open.length){
  let bi=0,bf=1e9;for(let i=0;i<open.length;i++){const f=g[open[i]]+hf(open[i]);if(f<bf){bf=f;bi=i}}
  const cur=open.splice(bi,1)[0];if(cl[cur])continue;cl[cur]=1;
  const cx=cur%W,cy=cur/W|0;if(cx==tx&&cy==ty){best=cur;break}
  const h=hf(cur);if(h<bh){bh=h;best=cur}
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
   if(!dx&&!dy)continue;const nx=cx+dx,ny=cy+dy;if(blk(nx,ny))continue;const n=ny*W+nx;if(cl[n])continue;
   if(dx&&dy&&(blk(cx+dx,cy)||blk(cx,cy+dy)))continue;
   const ng=g[cur]+(dx&&dy?1.41:1);if(ng<g[n]){g[n]=ng;par[n]=cur;open.push(n)}}
 }
 const p=[];for(let q=best;q>=0;q=par[q])p.push({x:(q%W+.5)*T,y:((q/W|0)+.5)*T});return p.reverse().slice(1);
}
function go(u,x,y,tg){const cx=v=>Math.max(0,Math.min(v,W-1)),cy=v=>Math.max(0,Math.min(v,H-1));u.goal={x,y};
 const sx=cx(u.x/T|0),sy=cy(u.y/T|0);let tx=cx(x/T|0),ty=cy(y/T|0);
 let fix=0;if(blk(tx,ty)){fix=1;let b=null,bd=1e9;
  if(tg&&tg.tx!==undefined){const w=S[tg.k].w||1,h=S[tg.k].h||1;for(let i=-1;i<=w;i++)for(let j=-1;j<=h;j++){if(i>=0&&i<w&&j>=0&&j<h)continue;if(blk(tg.tx+i,tg.ty+j))continue;const d=Math.hypot(tg.tx+i-sx,tg.ty+j-sy);if(d<bd){bd=d;b=[tg.tx+i,tg.ty+j]}}}
  if(!b)for(let r=1;r<=4&&!b;r++)for(let i=-r;i<=r;i++)for(let j=-r;j<=r;j++){if(Math.max(Math.abs(i),Math.abs(j))!=r||blk(tx+i,ty+j))continue;const d=Math.hypot(tx+i-sx,ty+j-sy);if(d<bd){bd=d;b=[tx+i,ty+j]}}
  if(b){tx=b[0];ty=b[1]}}
 u.path=astar(sx,sy,tx,ty);if(fix&&!u.path.length&&Math.hypot((tx+.5)*T-u.x,(ty+.5)*T-u.y)>3)u.path=[{x:(tx+.5)*T,y:(ty+.5)*T}]}
function startO(u){const o=u.o;if(o.t=='move'||o.t=='amove'||o.t=='patrol'){if(o.t=='patrol'){o.ax=u.x;o.ay=u.y}go(u,o.gx,o.gy)}else u.path=[]}
function order(u,o,sh){if(u.k=='tank'&&(u.sg==1||u.tr>0))return;if(sh&&(u.o.t!='idle'||u.oq.length))u.oq.push(o);else{u.oq=[];u.o=o;startO(u)}}
function gen(seed){
 terr=new Uint8Array(W*H);occ=new Uint8Array(W*H);hg=new Uint8Array(W*H);let s=seed*9301+7;const rnd=()=>(s=(s*16807+7)%2147483647)/2147483647;
 for(let i=0;i<W;i++)terr[i]=terr[(H-1)*W+i]=1;for(let j=0;j<H;j++)terr[j*W]=terr[j*W+W-1]=1;
 const put=(x,y,f)=>{f(x,y);f(W-1-x,H-1-y)};
 for(let y=30;y<=46;y++)for(let x=1;x<=14;x++)put(x,y,(a,b)=>hg[b*W+a]=1);
 for(let y=29;y<=46;y++)if(y<32||y>34)put(15,y,(a,b)=>terr[b*W+a]=2);
 for(let x=1;x<=15;x++)put(x,29,(a,b)=>terr[b*W+a]=2);
 for(let y=32;y<=34;y++)put(15,y,(a,b)=>hg[b*W+a]=2);
 const B=[[8,40],[26,41],[55,8],[37,7],[16,33],[47,14],[32,24,9],[26,30,6],[38,18,6],[32,34,5],[32,14,5],[20,22,5],[44,26,5]];
 for(let n=0;n<20;n++){const cx=8+rnd()*48|0,cy=4+rnd()*40|0,r=1+rnd()*2.2;if(B.some(b=>Math.hypot(cx-b[0],cy-b[1])<(b[2]||11)))continue;
  for(let x=-3;x<=3;x++)for(let y=-3;y<=3;y++)if(Math.hypot(x,y)<=r){const a=cx+x,b=cy+y;if(a>0&&b>0&&a<W-1&&b<H-1){terr[b*W+a]=1;terr[(H-1-b)*W+W-1-a]=1}}}
 const p=astar(8,40,55,8),l=p[p.length-1];return l&&Math.abs(l.x/T-55.5)<1.5&&Math.abs(l.y/T-8.5)<1.5;
}
function init(){
 E=[];nid=1;R=[{m:200,g:0},{m:200,g:0}];up=[{},{}];sel=[];mode=0;gt=0;wave=14;over=0;aiT=4;$('msg').style.display='none';vis=new Uint8Array(W*H);bm=0;grp=[];alertT=0;fxs=[];paused=0;
 for(let sd=1;!gen(sd);sd++);
 [[6,38],[24,39]].forEach(([tx,ty])=>{
  for(let i=0;i<8;i++){const x=tx-5,y=ty-2+i;mk('min',-1,(x+.5)*T,(y+.5)*T,{amt:1500,tx:x,ty:y});occ[y*W+x]=1;
   const mx=W-1-x,my=H-1-y;mk('min',-1,(mx+.5)*T,(my+.5)*T,{amt:1500,tx:mx,ty:my});occ[my*W+mx]=1}
  mkB('geo',-1,tx,ty+5,1).amt=2500;mkB('geo',-1,W-tx-3,H-ty-7,1).amt=2500});
 [[0,6,38],[1,54,7]].forEach(([t,tx,ty])=>{const cc=mkB('cc',t,tx,ty,1);cc.rl={res:nearest(E.filter(e=>e.k=='min'),cc.x,cc.y)};
  for(let i=0;i<4;i++){const u=mk('scv',t,cc.x-30+i*20,cc.y+62);gather(u,cc.rl.res)}
  if(!t){cam.x=cc.x-cv.width/2;cam.y=cc.y-(cv.height-150)/2}});
 clamp();
 mmB=document.createElement('canvas');mmB.width=W;mmB.height=H;const m=mmB.getContext('2d');
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;m.fillStyle=terr[i]==2?'#8a7050':terr[i]?'#777':hg[i]==1?'#3a5a34':hg[i]==2?'#7a7a50':'#1e3a22';m.fillRect(x,y,1,1)}
 fogC=document.createElement('canvas');fogC.width=W;fogC.height=H;fx=fogC.getContext('2d');fdata=fx.createImageData(W,H);
}
function gather(u,r){u.o={t:'gather',res:r,ph:'go',carry:0,tm:0};u.path=[]}
function dst(a,b){const s=S[b.k];if(s.w){const cx=Math.max(b.x-s.w*16,Math.min(a.x,b.x+s.w*16)),cy=Math.max(b.y-s.h*16,Math.min(a.y,b.y+s.h*16));return Math.hypot(a.x-cx,a.y-cy)}return Math.hypot(a.x-b.x,a.y-b.y)-s.r}
function foe(u,r){let b=null,bs=1e9;for(const e of E){if(e.t<0||e.t==u.t||e.hp<=0||(u.t==0&&!seen(e)))continue;const d=dst(u,e);if(d>r)continue;const sc=d+(S[e.k].w?500:0);if(sc<bs){bs=sc;b=e}}return b}
function ok(k,tx,ty,geo,pad=0){const s=S[k];if(k=='ref')return geo&&!geo.ref&&geo.tx==tx&&geo.ty==ty;
 for(let i=-pad;i<s.w+pad;i++)for(let j=-pad;j<s.h+pad;j++)if(blk(tx+i,ty+j)||hg[(ty+j)*W+tx+i]==2)return 0;return 1}
function spot(k,cx,cy,pad){for(let r=0;r<16;r++)for(let i=-r;i<=r;i++)for(let j=-r;j<=r;j++){if(Math.max(Math.abs(i),Math.abs(j))!=r)continue;if(ok(k,cx+i,cy+j,0,pad))return{tx:cx+i,ty:cy+j}}}
const supply=t=>{let u=0,cp=0;for(const e of E){if(e.t!=t)continue;const s=S[e.k];if(s.cap&&e.done)cp+=s.cap;if(s.sp)u+=s.su||1;if(e.q)u+=e.q.filter(x=>S[x.k].sp).reduce((a,x)=>a+(S[x.k].su||1),0)}return[u,Math.min(cp,100)]};
function train(b,k){const s=S[k],q=b.q;if(!b.done)return 0;if(q.length>=5){why='대기열이 가득 찼습니다';return 0}if(R[b.t].m<s.cost){why='미네랄이 부족합니다';return 0}
 if(k=='medic'&&!E.some(e=>e.t==b.t&&e.k=='aca'&&e.done&&e.hp>0)){why='아카데미가 필요합니다';return 0}if(R[b.t].g<(s.gas||0)){why='가스가 부족합니다';return 0}
 const[u,cp]=supply(b.t);if(u+(s.su||1)>cp){why='서플라이 디팟을 더 지어야 합니다';return 0}R[b.t].m-=s.cost;R[b.t].g-=s.gas||0;q.push({k,tm:s.time,t0:s.time});return 1}
function research(b,key){const u=UP[key],st=up[b.t];if(st[key]==1){why='이미 연구했습니다';return 0}if(st[key]){why='연구가 진행 중입니다';return 0}
 if(!b.done||R[b.t].m<u.m||R[b.t].g<u.g){why='미네랄/가스가 부족합니다';return 0}R[b.t].m-=u.m;R[b.t].g-=u.g;st[key]=-1;b.q.push({k:'up',key,tm:u.t,t0:u.t});return 1}
function cmdBuild(u,k,tx,ty,geo,sh){const s=S[k];if(R[u.t].m<s.cost||R[u.t].g<(s.gas||0))return 0;R[u.t].m-=s.cost;R[u.t].g-=s.gas||0;order(u,{t:'build',b:k,tx,ty,geo},sh);return 1}
function back(u){const m=u.t==1&&nearest(E.filter(e=>e.k=='min'&&e.hp>0),u.x,u.y);if(m)gather(u,m);else u.o={t:'idle'}}
const busy=(r,u)=>r.w&&r.w!=u.id&&E.some(e=>e.id==r.w&&e.hp>0&&e.o.res===r&&e.o.ph=='mine');
const freeMin=(u,r)=>nearest(E.filter(m=>m.k=='min'&&m.hp>0&&!busy(m,u)&&Math.hypot(m.x-r.x,m.y-r.y)<380),u.x,u.y);
const seen=e=>vis[(e.y/T|0)*W+(e.x/T|0)]==2;
function fog(){for(let i=0;i<vis.length;i++)if(vis[i]==2)vis[i]=1;
 for(const e of E){if(e.t!=0)continue;const r=e.k=='cc'?11:S[e.k].w?9:8,cx=e.x/T|0,cy=e.y/T|0,vh=hg[cy*W+cx];
  for(let y=Math.max(0,cy-r);y<=Math.min(H-1,cy+r);y++)for(let x=Math.max(0,cx-r);x<=Math.min(W-1,cx+r);x++)if((x-cx)*(x-cx)+(y-cy)*(y-cy)<=r*r&&(vh||hg[y*W+x]!=1))vis[y*W+x]=2}}
