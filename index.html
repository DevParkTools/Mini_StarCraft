<style>

.gr{display:flex;flex-wrap:wrap;gap:3px;max-width:600px}.ic2{width:40px;height:36px;border:2px solid #3d3;background:#0a1a24;font-size:11px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}.ic2 b{position:absolute;left:0;bottom:0;height:3px;background:#3d3}

</style></head><body>
<canvas id="g"></canvas><button id="iw">일꾼 찾기 (F1)</button>
<div id="tp"><span style="color:#6cf"><i class="ic m"></i><b id="rm">0</b></span><span style="color:#5f9"><i class="ic g"></i><b id="rg">0</b></span><span style="color:#fc6"><i class="ic s"></i><b id="rs">0</b></span></div><div id="msg"></div>
<div id="hud"><div id="mmw"><canvas id="mm" width="138" height="104"></canvas></div><div id="mid"><div id="info"></div></div><div id="cmd"></div></div>
<script>
/* 미니 스타크래프트 (테란 미러) - 조작 (스타크래프트와 동일)
 좌클릭 선택 / 드래그 박스 / 더블클릭 같은 종류 전체 / Shift 추가 / 우클릭 이동·공격·채취·랠리
 M 이동, S 정지, H 홀드, A 공격이동, SCV: B(건설) → C 커맨드센터, S 서플라이, R 정제소, B 배럭
 커맨드센터 S: SCV / 배럭 M: 마린, U: 전투 강화 / 대기열 슬롯 클릭 = 취소
 Ctrl+1~9 부대 지정, 1~9 호출(두 번 누르면 이동), F1 놀고 있는 일꾼, Space 경보 위치, 방향키/가장자리 스크롤 */
const $=i=>document.getElementById(i),cv=$('g'),c=cv.getContext('2d'),M=$('mm'),mc=M.getContext('2d');
const T=32,W=64,H=48,TC=['#3af','#f44'];
const S={scv:{hp:60,r:8,sp:75,cost:50,time:8,rng:14,dmg:5,cd:1},marine:{hp:40,r:7,sp:85,cost:50,time:10,rng:130,dmg:7,cd:.65},
cc:{hp:1000,w:4,h:3,cost:400,time:40,cap:10},dep:{hp:400,w:2,h:2,cost:100,time:12,cap:8},rax:{hp:800,w:3,h:2,cost:150,time:20},ref:{hp:500,w:3,h:2,cost:75,time:10},
min:{r:10},geo:{w:3,h:2},up:{}};
const NM={scv:'SCV',marine:'마린',cc:'커맨드센터',dep:'서플라이 디팟',rax:'배럭',ref:'정제소',min:'미네랄',geo:'베스핀 가스'};
let E,terr,occ,R,up,sel,cam={x:0,y:0},mode,pk,drag,mX=-1,mY=-1,nid,gt,wave,over,aiT,ft=0,fs='',keys={},mmB,hg,vis,fogC,fx,fdata,bm=0,grp=[],alertT=0,alertP=[0,0],lastClk=[0,0],lastG=[0,0],why='';
const blk=(x,y)=>x<0||y<0||x>=W||y>=H||terr[y*W+x]||occ[y*W+x];
const fill=(e,v)=>{const s=S[e.k];for(let i=0;i<s.w;i++)for(let j=0;j<s.h;j++)occ[(e.ty+j)*W+e.tx+i]=v};
const nearest=(l,x,y)=>l.reduce((a,e)=>!a||Math.hypot(e.x-x,e.y-y)<Math.hypot(a.x-x,a.y-y)?e:a,null);
const flash=t=>{fs=t;ft=1.6};
function mk(k,t,x,y,x2){const s=S[k];const e={id:nid++,k,t,x,y,hp:s.hp||1,mhp:s.hp||1,cd:0,rp:0,fl:0,f:0,o:{t:'idle'},path:[],done:1,...x2};E.push(e);return e}
function mkB(k,t,tx,ty,done){const s=S[k],e=mk(k,t,(tx+s.w/2)*T,(ty+s.h/2)*T,{tx,ty,q:[],prog:done?1:0,done:done?1:0});if(!done)e.hp=1;fill(e,1);return e}
function astar(sx,sy,tx,ty){
 const N=W*H,g=new Float32Array(N).fill(1e9),par=new Int16Array(N).fill(-1),cl=new Uint8Array(N);
 const hf=i=>{const dx=Math.abs(i%W-tx),dy=Math.abs((i/W|0)-ty);return Math.max(dx,dy)+.41*Math.min(dx,dy)};
 const s0=sy*W+sx;let open=[s0],best=s0,bh=hf(s0);g[s0]=0;
 while(open.length){
  let bi=0,bf=1e9;for(let i=0;i<open.length;i++){const f=g[open[i]]+hf(open[i]);if(f<bf){bf=f;bi=i}}
  const cur=open.splice(bi,1)[0];if(cl[cur])continue;cl[cur]=1;
  const cx=cur%W,cy=cur/W|0;if(cx==tx&&cy==ty){best=cur;break}
  const h=hf(cur);if(h<bh){bh=h;best=cur}
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
   if(!dx&&!dy)continue;const nx=cx+dx,ny=cy+dy;if(blk(nx,ny))continue;const n=ny*W+nx;if(cl[n])continue;
   if(dx&&dy&&(blk(cx+dx,cy)||blk(cx,cy+dy)))continue;
   const ng=g[cur]+(dx&&dy?1.41:1);if(ng<g[n]){g[n]=ng;par[n]=cur;open.push(n)}}
 }
 const p=[];for(let q=best;q>=0;q=par[q])p.push({x:(q%W+.5)*T,y:((q/W|0)+.5)*T});return p.reverse().slice(1);
}
function go(u,x,y){const cx=v=>Math.max(0,Math.min(v,W-1)),cy=v=>Math.max(0,Math.min(v,H-1));u.goal={x,y};
 const sx=cx(u.x/T|0),sy=cy(u.y/T|0);let tx=cx(x/T|0),ty=cy(y/T|0);
 if(blk(tx,ty)){let b=null,bd=1e9;for(let r=1;r<=4&&!b;r++)for(let i=-r;i<=r;i++)for(let j=-r;j<=r;j++){if(Math.max(Math.abs(i),Math.abs(j))!=r||blk(tx+i,ty+j))continue;const d=Math.hypot(tx+i-sx,ty+j-sy);if(d<bd){bd=d;b=[tx+i,ty+j]}}
  if(b){tx=b[0];ty=b[1]}}
 u.path=astar(sx,sy,tx,ty)}
function gen(seed){
 terr=new Uint8Array(W*H);occ=new Uint8Array(W*H);hg=new Uint8Array(W*H);let s=seed*9301+7;const rnd=()=>(s=(s*16807+7)%2147483647)/2147483647;
 for(let i=0;i<W;i++)terr[i]=terr[(H-1)*W+i]=1;for(let j=0;j<H;j++)terr[j*W]=terr[j*W+W-1]=1;
 const put=(x,y,f)=>{f(x,y);f(W-1-x,H-1-y)};
 for(let y=30;y<=46;y++)for(let x=1;x<=14;x++)put(x,y,(a,b)=>hg[b*W+a]=1);
 for(let y=29;y<=46;y++)if(y<32||y>34)put(15,y,(a,b)=>terr[b*W+a]=2);
 for(let x=1;x<=15;x++)put(x,29,(a,b)=>terr[b*W+a]=2);
 for(let y=32;y<=34;y++)put(15,y,(a,b)=>hg[b*W+a]=2);
 const B=[[6,40],[24,41],[57,8],[39,7],[16,33],[47,14]];
 for(let n=0;n<26;n++){const cx=8+rnd()*48|0,cy=4+rnd()*40|0,r=1+rnd()*2.6;if(B.some(b=>Math.hypot(cx-b[0],cy-b[1])<11))continue;
  for(let x=-3;x<=3;x++)for(let y=-3;y<=3;y++)if(Math.hypot(x,y)<=r){const a=cx+x,b=cy+y;if(a>0&&b>0&&a<W-1&&b<H-1){terr[b*W+a]=1;terr[(H-1-b)*W+W-1-a]=1}}}
 const p=astar(6,40,57,8),l=p[p.length-1];return l&&Math.abs(l.x/T-57.5)<1.5&&Math.abs(l.y/T-8.5)<1.5;
}
function init(){
 E=[];nid=1;R=[{m:200,g:0},{m:200,g:0}];up=[0,0];sel=[];mode=0;gt=0;wave=10;over=0;aiT=4;$('msg').style.display='none';vis=new Uint8Array(W*H);bm=0;grp=[];alertT=0;
 for(let sd=1;!gen(sd);sd++);
 [[4,38],[22,39]].forEach(([tx,ty])=>{
  for(let i=0;i<8;i++){const x=tx-3,y=ty-2+i;mk('min',-1,(x+.5)*T,(y+.5)*T,{amt:1500,tx:x,ty:y});occ[y*W+x]=1;
   const mx=W-1-x,my=H-1-y;mk('min',-1,(mx+.5)*T,(my+.5)*T,{amt:1500,tx:mx,ty:my});occ[my*W+mx]=1}
  mkB('geo',-1,tx,ty+5,1).amt=2500;mkB('geo',-1,W-tx-3,H-ty-7,1).amt=2500});
 [[0,4,38],[1,56,7]].forEach(([t,tx,ty])=>{const cc=mkB('cc',t,tx,ty,1);cc.rl={res:nearest(E.filter(e=>e.k=='min'),cc.x,cc.y)};
  for(let i=0;i<4;i++){const u=mk('scv',t,cc.x-30+i*20,cc.y+62);gather(u,cc.rl.res)}
  if(!t){cam.x=cc.x-cv.width/2;cam.y=cc.y-(cv.height-150)/2}});
 clamp();
 mmB=document.createElement('canvas');mmB.width=W;mmB.height=H;const m=mmB.getContext('2d');
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;m.fillStyle=terr[i]==2?'#8a7050':terr[i]?'#777':hg[i]==1?'#3a5a34':hg[i]==2?'#7a7a50':'#1e3a22';m.fillRect(x,y,1,1)}
 fogC=document.createElement('canvas');fogC.width=W;fogC.height=H;fx=fogC.getContext('2d');fdata=fx.createImageData(W,H);
}
function gather(u,r){u.o={t:'gather',res:r,ph:'go',carry:0,tm:0};u.path=[]}
function dst(a,b){const s=S[b.k];if(s.w){const cx=Math.max(b.x-s.w*16,Math.min(a.x,b.x+s.w*16)),cy=Math.max(b.y-s.h*16,Math.min(a.y,b.y+s.h*16));return Math.hypot(a.x-cx,a.y-cy)}return Math.hypot(a.x-b.x,a.y-b.y)-s.r}
function foe(u,r){let b=null,bs=1e9;for(const e of E){if(e.t<0||e.t==u.t||e.hp<=0)continue;const d=dst(u,e);if(d>r)continue;const sc=d+(S[e.k].w?500:0);if(sc<bs){bs=sc;b=e}}return b}
function ok(k,tx,ty,geo,pad=0){const s=S[k];if(k=='ref')return geo&&!geo.ref&&geo.tx==tx&&geo.ty==ty;
 for(let i=-pad;i<s.w+pad;i++)for(let j=-pad;j<s.h+pad;j++)if(blk(tx+i,ty+j)||hg[(ty+j)*W+tx+i]==2)return 0;return 1}
function spot(k,cx,cy,pad){for(let r=0;r<16;r++)for(let i=-r;i<=r;i++)for(let j=-r;j<=r;j++){if(Math.max(Math.abs(i),Math.abs(j))!=r)continue;if(ok(k,cx+i,cy+j,0,pad))return{tx:cx+i,ty:cy+j}}}
const supply=t=>{let u=0,cp=0;for(const e of E){if(e.t!=t)continue;const s=S[e.k];if(s.cap&&e.done)cp+=s.cap;if(s.sp)u++;if(e.q)u+=e.q.filter(x=>S[x.k].sp).length}return[u,Math.min(cp,100)]};
function train(b,k){const s=S[k],q=b.q;if(!b.done)return 0;if(q.length>=5){why='대기열이 가득 찼습니다';return 0}if(R[b.t].m<s.cost){why='미네랄이 부족합니다';return 0}
 const[u,cp]=supply(b.t);if(u>=cp){why='서플라이 디팟을 더 지어야 합니다';return 0}R[b.t].m-=s.cost;q.push({k,tm:s.time,t0:s.time});return 1}
function research(b){if(up[b.t]==1){why='이미 연구했습니다';return 0}if(up[b.t]){why='연구가 진행 중입니다';return 0}if(!b.done||R[b.t].m<100||R[b.t].g<100){why='미네랄/가스가 부족합니다';return 0}
 R[b.t].m-=100;R[b.t].g-=100;up[b.t]=-1;b.q.push({k:'up',tm:25,t0:25});return 1}
function cmdBuild(u,k,tx,ty,geo){const s=S[k];if(R[u.t].m<s.cost)return 0;R[u.t].m-=s.cost;u.o={t:'build',b:k,tx,ty,geo};u.path=[];return 1}
function back(u){const m=u.t==1&&nearest(E.filter(e=>e.k=='min'&&e.hp>0),u.x,u.y);if(m)gather(u,m);else u.o={t:'idle'}}
const busy=(r,u)=>r.w&&r.w!=u.id&&E.some(e=>e.id==r.w&&e.hp>0&&e.o.res===r&&e.o.ph=='mine');
const freeMin=(u,r)=>nearest(E.filter(m=>m.k=='min'&&m.hp>0&&!busy(m,u)&&Math.hypot(m.x-r.x,m.y-r.y)<380),u.x,u.y);
const seen=e=>vis[(e.y/T|0)*W+(e.x/T|0)]==2;
function fog(){for(let i=0;i<vis.length;i++)if(vis[i]==2)vis[i]=1;
 for(const e of E){if(e.t!=0)continue;const r=e.k=='cc'?11:S[e.k].w?9:8,cx=e.x/T|0,cy=e.y/T|0;
  for(let y=Math.max(0,cy-r);y<=Math.min(H-1,cy+r);y++)for(let x=Math.max(0,cx-r);x<=Math.min(W-1,cx+r);x++)if((x-cx)*(x-cx)+(y-cy)*(y-cy)<=r*r)vis[y*W+x]=2}}
function upU(u,dt){
 const st=S[u.k],o=u.o;u.cd-=dt;u.rp-=dt;u.fl-=dt;
 const mv=()=>{if(!u.path.length)return 0;const p=u.path[0],dx=p.x-u.x,dy=p.y-u.y,d=Math.hypot(dx,dy),s=st.sp*dt;u.f=Math.atan2(dy,dx);if(d<=s){u.x=p.x;u.y=p.y;u.path.shift()}else{u.x+=dx/d*s;u.y+=dy/d*s}return 1};
 const hit=tg=>{if(dst(u,tg)<=st.rng){u.path=[];u.f=Math.atan2(tg.y-u.y,tg.x-u.x);if(u.cd<=0){u.cd=st.cd;tg.hp-=st.dmg+(u.k=='marine'&&up[u.t]==1?3:0);u.fl=.08;u.ft=tg;if(tg.t==0){alertT=4;alertP=[tg.x,tg.y]}}}
  else{if(u.rp<=0||!u.path.length){u.rp=.6;go(u,tg.x,tg.y)}mv()}};
 if(o.t=='move'){if(!mv())o.t='idle'}
 else if(o.t=='atk'){if(!o.tgt||o.tgt.hp<=0)o.t='idle';else hit(o.tgt)}
 else if(o.t=='idle'||o.t=='amove'){
  const tg=u.k=='marine'?foe(u,o.t=='idle'?150:200):null;
  if(tg)hit(tg);else if(o.t=='amove'&&!mv()){if(Math.hypot(o.gx-u.x,o.gy-u.y)<90)o.t='idle';else if(u.rp<=0){u.rp=.4;go(u,o.gx,o.gy)}}}
 else if(o.t=='hold'){const tg=u.k=='marine'?foe(u,st.rng):null;if(tg)hit(tg)}
 else if(o.t=='gather'){
  const r=o.res,A=r&&(r.k=='ref'?r.geo:r);
  if(o.ph=='go'){
   if(!r||r.hp<=0||A.amt<=0){const n=r&&r.k=='ref'?null:nearest(E.filter(e=>e.k=='min'&&e.hp>0),u.x,u.y);if(n)gather(u,n);else o.t='idle';return}
   if(r.k=='ref'&&!r.done)return;
   if(dst(u,r)<=(r.k=='min'?40:30)){u.path=[];
    if(busy(r,u)){if(u.rp<=0){u.rp=.3;const a=r.k=='min'&&freeMin(u,r);if(a)o.res=a}}
    else{r.w=u.id;o.ph='mine';o.tm=r.k=='min'?2.2:1.8}}
   else if(!mv()&&u.rp<=0){u.rp=.7;go(u,r.x,r.y)}}
  else if(o.ph=='mine'){o.tm-=dt;if(o.tm<=0){const n=Math.min(A.amt,r.k=='min'?5:4);A.amt-=n;o.carry=n;o.ct=r.k=='min'?'m':'g';if(A.amt<=0&&r.k=='min')r.hp=0;r.w=0;o.ph='ret'}}
  else{const cc=nearest(E.filter(e=>e.k=='cc'&&e.t==u.t&&e.done&&e.hp>0),u.x,u.y);if(!cc){o.t='idle';return}
   if(dst(u,cc)<=30){R[u.t][o.ct]+=o.carry;o.carry=0;o.ph='go';if(r&&r.k=='min'){const a=freeMin(u,r);if(a)o.res=a}}else if(!mv()&&u.rp<=0){u.rp=.7;go(u,cc.x,cc.y)}}}
 else if(o.t=='build'){
  const s=S[o.b],cx=Math.max(o.tx*T,Math.min(u.x,(o.tx+s.w)*T)),cy=Math.max(o.ty*T,Math.min(u.y,(o.ty+s.h)*T));
  if(Math.hypot(u.x-cx,u.y-cy)<=20){
   if(ok(o.b,o.tx,o.ty,o.geo)){const b=mkB(o.b,u.t,o.tx,o.ty,0);if(o.geo){o.geo.ref=b;b.geo=o.geo}
    E.forEach(v=>{if(v.goal&&v.path.length)go(v,v.goal.x,v.goal.y)});if(o.b=='ref')gather(u,b);else back(u)}
   else{R[u.t].m+=s.cost;back(u)}}
  else if(!mv()&&u.rp<=0){u.rp=.6;go(u,(o.tx+s.w/2)*T,(o.ty+s.h/2)*T)}}
}
function upB(b,dt){const s=S[b.k];
 if(!b.done){b.prog+=dt/s.time;b.hp=Math.max(1,s.hp*b.prog);if(b.prog>=1){b.done=1;b.hp=s.hp;
  if(b.k=='cc'){const m=nearest(E.filter(e=>e.k=='min'&&e.hp>0),b.x,b.y);if(m&&Math.hypot(m.x-b.x,m.y-b.y)<320)b.rl={res:m}}}return}
 const q=b.q[0];if(!q)return;q.tm-=dt;if(q.tm>0)return;b.q.shift();
